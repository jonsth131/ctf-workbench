[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-workbench"
version = "0.1.0"
description = "A keyboard-first terminal interface for CTF work"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
lint = [
    "ruff>=0.11",
]

[project.scripts]
ctf-workbench = "ctfwb.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
